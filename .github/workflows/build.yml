name: Build & Test (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tempelkan hasil build ke rilis yang sudah ada (mis. v4.4.3); kosongkan bila tidak'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Depup Office Desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DepupOfficeDesktop.sln

      - name: Build
        run: dotnet build DepupOfficeDesktop.sln -c Release --no-restore

      - name: Test
        env:
          DEPUP_SHOTS: ${{ github.workspace }}\TestResults\screens
        run: dotnet test DepupOfficeDesktop.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Publish (single-file exe)
        if: github.event_name != 'pull_request'
        run: dotnet publish DepupOfficeDesktop/DepupOfficeDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o publish

      - name: Upload app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DepupOffice-win-x64
          path: publish/

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Copy-Item publish/DepupOffice.exe "DepupOffice-$v-win-x64.exe"
          Compress-Archive -Path publish/* -DestinationPath "DepupOffice-$v-win-x64.zip"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Depup Office Desktop ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            DepupOffice-${{ github.ref_name }}-win-x64.exe
            DepupOffice-${{ github.ref_name }}-win-x64.zip

  mac:
    name: Depup Office Mac (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build .app & .dmg
        working-directory: mac
        env:
          DMG: '1'
        run: ./build-mac-app.sh ${{ matrix.arch }}

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: DepupOffice-macos-${{ matrix.arch }}
          path: mac/build/*.dmg

      - name: GitHub Release (Mac)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: mac/build/*.dmg
