name: Build & Test (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Depup Office Desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DepupOfficeDesktop.sln

      - name: Build
        run: dotnet build DepupOfficeDesktop.sln -c Release --no-restore

      - name: Test
        run: dotnet test DepupOfficeDesktop.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Publish (single-file exe)
        if: github.event_name != 'pull_request'
        run: dotnet publish DepupOfficeDesktop/DepupOfficeDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DepupOffice-win-x64
          path: publish/
